[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tei-translate"
version = "0.1.0"
description = "Translate TEI XML documents while preserving tag structure and meaning."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies. Add new ones (gradio, transformers, ...) when the code
# that needs them lands; heavy ML libraries go in an optional extra.
dependencies = [
    "lxml",            # TEI parsing (tei_translate.pipeline)
    "pyyaml",          # policy and pair configs
    "sacrebleu>=2.0",  # chrF and BLEU (tei_translate.metrics.translation_scores)
]

[project.optional-dependencies]
dev = ["pytest"]
# Real MT engines (tei_translate.engines.hf): pip install -e .[mt]
# Kept out of the base install because torch is large.
mt = [
    "torch",
    "transformers",
    "sentencepiece",   # Marian (Opus-MT), MADLAD and NLLB tokenizers
    "peft",            # LoRA adapters (NLLB Ancient -> Modern Greek, pivot-grc-el-en)
]

[tool.hatch.build.targets.wheel]
packages = ["src/tei_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
