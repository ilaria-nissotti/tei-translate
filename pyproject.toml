[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tei-translate"
version = "0.1.0"
description = "Translate TEI XML documents while preserving tag structure and meaning."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies. Add new ones (gradio, transformers, ...) when the code
# that needs them lands; heavy ML libraries go in an optional extra.
dependencies = ["lxml", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/tei_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
