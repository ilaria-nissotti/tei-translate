# Language pair: Ancient Greek -> English.
# The only pair-specific settings; the pipeline code is the same for every pair.
src: grc
tgt: en
# identity | tag (test engines, no model)
# opus-grk-en | opus-bible-ine | madlad-3b | marian:<HF model id> | madlad:<HF model id>
# (model engines need: pip install -e .[mt]; see tei_translate/engines/__init__.py)
# Default: madlad-3b (decided 2026-11-20, locally and on the HF Space; pivot-grc-el-en is the
# fallback if MADLAD is too slow on the Space CPU). See docs/engine_comparison.md.
engine: madlad-3b
# hybrid: whole sentences to the engine, tags placed afterwards (default)
# spanwise: every text piece translated where it is (tags never move)
placement: hybrid
# word aligner for hybrid placement: ugarit | dragoman | xlmr | embed:<HF id> | none | monotone (test)
# (model aligners need: pip install -e .[mt]; see tei_translate/align/__init__.py)
aligner: ugarit
policy: config/policy.yaml   # relative to the repository root
# RELAX NG schema the output is checked against (TEI P5 4.12.0 tei_all, see config/schemas/README.md);
# null skips the check
schema: config/schemas/tei_all.rng
