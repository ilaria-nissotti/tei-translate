# Language pair: Ancient Greek -> English.
# The only pair-specific settings; the pipeline code is the same for every pair.
src: grc
tgt: en
# identity | tag (test engines, no model)
# opus-grk-en | opus-bible-ine | madlad-3b | marian:<HF model id> | madlad:<HF model id>
